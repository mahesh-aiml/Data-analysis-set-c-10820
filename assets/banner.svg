<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#312e81"/><stop offset="1" stop-color="#0e7490"/>
</linearGradient>
<linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#67e8f9"/>
</linearGradient>
<clipPath id="r"><rect x="0" y="0" width="1200" height="320" rx="18"/></clipPath>
<clipPath id="type"><rect x="70" y="190" height="40" width="0">
<animate attributeName="width" values="0;640;640;0" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<g clip-path="url(#r)">
<rect width="1200" height="320" fill="url(#bg)"/>
<circle cx="1020" cy="70" r="120" fill="#22d3ee" opacity="0.10"><animate attributeName="cy" values="70;110;70" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="900" cy="260" r="80" fill="#a78bfa" opacity="0.12"><animate attributeName="cy" values="260;220;260" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="140" cy="300" r="60" fill="#34d399" opacity="0.10"><animate attributeName="r" values="60;80;60" dur="4s" repeatCount="indefinite"/></circle>
<g opacity="0.22">
<path d="M0 270 Q 150 230 300 270 T 600 270 T 900 270 T 1200 270 T 1500 270 V 320 H 0 Z" fill="#67e8f9">
<animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="9s" repeatCount="indefinite"/></path>
<path d="M0 285 Q 150 255 300 285 T 600 285 T 900 285 T 1200 285 T 1500 285 V 320 H 0 Z" fill="#a78bfa">
<animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="12s" repeatCount="indefinite"/></path>
</g>
<!-- mini animated bars -->
<g transform="translate(860 70)">
<rect x="0" y="100" width="34" height="0" rx="6" fill="#67e8f9"><animate attributeName="height" values="0;60;60" keyTimes="0;0.3;1" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="160;100;100" keyTimes="0;0.3;1" dur="4s" repeatCount="indefinite"/></rect>
<rect x="50" y="60" width="34" height="0" rx="6" fill="#a78bfa"><animate attributeName="height" values="0;100;100" keyTimes="0;0.4;1" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="160;60;60" keyTimes="0;0.4;1" dur="4s" repeatCount="indefinite"/></rect>
<rect x="100" y="30" width="34" height="0" rx="6" fill="#34d399"><animate attributeName="height" values="0;130;130" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="160;30;30" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/></rect>
<rect x="150" y="0" width="34" height="0" rx="6" fill="#fbbf24"><animate attributeName="height" values="0;160;160" keyTimes="0;0.6;1" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="160;0;0" keyTimes="0;0.6;1" dur="4s" repeatCount="indefinite"/></rect>
</g>
<text x="70" y="110" font-size="50" font-weight="800" fill="url(#ttl)">Training Performance
<animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/></text>
<text x="70" y="165" font-size="50" font-weight="800" fill="url(#ttl)">Analysis<animate attributeName="opacity" from="0" to="1" dur="1.6s" fill="freeze"/></text>
<g clip-path="url(#type)"><text x="70" y="220" font-size="26" fill="#e0f2fe">SQL  •  Excel  •  Python  •  Power BI</text></g>
<rect x="70" y="222" width="3" height="4" fill="none"/>
<text x="70" y="275" font-size="16" fill="#bae6fd" opacity="0.9">12 assessments · 4 courses · 3 batches · Jan–Mar</text>
</g></svg>